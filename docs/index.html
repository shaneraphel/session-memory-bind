<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><title>Session memory</title>
<style>body{font-family:ui-sans-serif,system-ui,sans-serif;margin:2rem;max-width:44rem}</style></head>
<body>
<h1>Session-bound memory</h1>
<p>Writes require a session id.</p>
<label>session <input id="sid" value="a" /></label>
<label>text <input id="text" value="hello" /></label>
<button id="go">Remember</button>
<pre id="out"></pre>
<script>
const MEMORY = {};
function remember(text, sessionId) {
  if (!sessionId) throw new Error("memory write requires a session id");
  (MEMORY[sessionId] ||= []).push(text);
}
document.getElementById("go").onclick = () => {
  const out = document.getElementById("out");
  try {
    remember(document.getElementById("text").value, document.getElementById("sid").value);
    out.textContent = JSON.stringify(MEMORY, null, 2);
  } catch (e) { out.textContent = e.message; }
};
</script>
</body></html>
